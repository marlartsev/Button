<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>touch</title>

<style>
:root{
  --vh:1vh;
  --tone:0deg;
}

html,body{
  margin:0;
  width:100%;
  height:calc(var(--vh) * 100);
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#d7a79a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  touch-action:manipulation;
  overscroll-behavior:none;
}

.world{
  position:fixed;
  inset:0;
  width:100vw;
  height:calc(var(--vh) * 100);

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(circle at 50% 48%, rgba(255,235,228,.42), transparent 22%),
    radial-gradient(circle at 50% 58%, rgba(215,150,132,.34), transparent 46%),
    radial-gradient(circle at 50% 88%, rgba(121,62,56,.30), transparent 52%),
    linear-gradient(180deg,#efc9bd 0%, #d59f92 58%, #8a564d 100%);

  filter:hue-rotate(var(--tone));

  transition:
    background 2s ease,
    filter 1.8s ease;
}

.world::after{
  content:"";
  position:absolute;
  inset:-16%;

  background:
    radial-gradient(circle at 50% 50%, rgba(255,240,232,.16), transparent 34%),
    radial-gradient(circle at 50% 80%, rgba(60,24,22,.16), transparent 46%);

  filter:blur(90px);

  animation:breathe 10s ease-in-out infinite;
}

.button{
  position:relative;

  width:min(34vw,170px);
  aspect-ratio:1/1;

  border:none;
  outline:none;
  border-radius:999px;

  background:
    radial-gradient(circle at 50% 40%, rgba(255,220,220,.18), transparent 22%),
    radial-gradient(circle at 50% 50%, #b16a6f 0%, #99555b 58%, #7f4047 100%);

  box-shadow:
    inset 0 6px 10px rgba(255,220,220,.08),
    inset 0 -10px 18px rgba(42,12,12,.22),
    0 12px 28px rgba(78,24,28,.18);

  transition:
    transform 1.5s cubic-bezier(.16,.84,.2,1),
    filter 1.5s ease,
    background 1.8s ease;
}

.button::after{
  content:"";
  position:absolute;
  inset:20%;
  border-radius:inherit;

  background:
    radial-gradient(circle at 50% 38%, rgba(255,220,220,.14), transparent 45%);

  filter:blur(10px);
}

.button.pressing{
  transform:scale(.92);
}

.button.active{
  background:
    radial-gradient(circle at 50% 40%, rgba(255,220,220,.22), transparent 22%),
    radial-gradient(circle at 50% 50%, #ca7f84 0%, #b5646a 58%, #964950 100%);
}

@keyframes breathe{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.05);
  }
}
</style>
</head>

<body>

<div class="world" id="world">
  <button class="button" id="button"></button>
</div>

<script>
function setVH(){
  document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
}
setVH();
window.addEventListener("resize", setVH);
window.addEventListener("orientationchange", () => setTimeout(setVH, 300));

const world = document.getElementById("world");
const button = document.getElementById("button");

let locked = false;
let audioCtx;

function ctx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

  return audioCtx;
}

function vibrate(pattern){

  if(navigator.vibrate){
    navigator.vibrate(pattern);
  }

  // iOS fallback illusion
  document.body.style.transform = "translateX(.3px)";
  setTimeout(()=>{
    document.body.style.transform = "";
  },30);
}

function deepClick(){

  const ac = ctx();
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  const gain = ac.createGain();
  const filter = ac.createBiquadFilter();

  osc.type = "sine";
  osc.frequency.setValueAtTime(52, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);

  filter.type = "lowpass";
  filter.frequency.value = 120;

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.24, now + 0.06);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);

  osc.start(now);
  osc.stop(now + 0.85);
}

function lowHum(duration=3){

  const ac = ctx();
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  const gain = ac.createGain();

  osc.type = "triangle";
  osc.frequency.value = 38;

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.04, now + 0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(ac.destination);

  osc.start(now);
  osc.stop(now + duration);
}

function shiftTone(){

  world.style.setProperty("--tone","-10deg");

  setTimeout(()=>{
    world.style.setProperty("--tone","0deg");
  },2200);
}

function strongerShift(){

  world.style.background = `
    radial-gradient(circle at 50% 48%, rgba(255,235,228,.46), transparent 22%),
    radial-gradient(circle at 50% 58%, rgba(233,132,152,.38), transparent 46%),
    radial-gradient(circle at 50% 88%, rgba(121,62,56,.30), transparent 52%),
    linear-gradient(180deg,#f3c3cd 0%, #d58b9e 58%, #92505c 100%)
  `;

  setTimeout(()=>{
    world.style.background = `
      radial-gradient(circle at 50% 48%, rgba(255,235,228,.42), transparent 22%),
      radial-gradient(circle at 50% 58%, rgba(215,150,132,.34), transparent 46%),
      radial-gradient(circle at 50% 88%, rgba(121,62,56,.30), transparent 52%),
      linear-gradient(180deg,#efc9bd 0%, #d59f92 58%, #8a564d 100%)
    `;
  },2600);
}

const effects = [

  ()=>{},

  ()=>{
    shiftTone();
  },

  ()=>{
    strongerShift();
  },

  ()=>{
    button.classList.add("active");

    setTimeout(()=>{
      button.classList.remove("active");
    },2200);
  },

  ()=>{
    lowHum();
  },

  ()=>{
    vibrate(60);
  },

  ()=>{
    vibrate([100,120,120]);
  },

  ()=>{
    setTimeout(()=>{
      lowHum(4.5);
    },1200);
  },

  ()=>{
    setTimeout(()=>{
      vibrate([60,120,80]);
    },1000);
  }
];

button.addEventListener("click", ()=>{

  if(locked) return;

  locked = true;

  button.classList.add("pressing");

  deepClick();

  const effect = effects[Math.floor(Math.random()*effects.length)];

  setTimeout(()=>{
    effect();
  },500 + Math.random()*1200);

  setTimeout(()=>{
    button.classList.remove("pressing");
  },1800);

  setTimeout(()=>{
    locked = false;
  },5200);

});
</script>

</body>
</html>
