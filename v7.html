<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>touch</title>
<style>
:root{--vh:1vh;--tone:0deg}html,body{margin:0;padding:0;width:100%;height:calc(var(--vh)*100);overflow:hidden;position:fixed;inset:0;background:#d59f92}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{touch-action:manipulation;overscroll-behavior:none}.world{position:fixed;inset:0;width:100vw;height:calc(var(--vh)*100);display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 48%,rgba(255,235,228,.44),transparent 24%),radial-gradient(circle at 50% 58%,rgba(215,150,132,.38),transparent 48%),radial-gradient(circle at 50% 88%,rgba(121,62,56,.30),transparent 52%),linear-gradient(180deg,#efc9bd 0%,#d59f92 58%,#8a564d 100%);filter:hue-rotate(var(--tone));transition:background 2s ease,filter 1.8s ease,transform 80ms ease}.world:after{content:"";position:absolute;inset:-16%;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,240,232,.16),transparent 34%),radial-gradient(circle at 50% 80%,rgba(60,24,22,.16),transparent 46%);filter:blur(90px);animation:breathe 11s ease-in-out infinite}.button{position:relative;z-index:10;width:min(34vw,170px);aspect-ratio:1/1;border:none;outline:none;border-radius:999px;cursor:pointer;touch-action:manipulation;background:radial-gradient(circle at 50% 41%,rgba(255,225,222,.20),transparent 24%),radial-gradient(circle at 50% 50%,#b46b71 0%,#9b555c 58%,#7d3e46 100%);box-shadow:inset 0 5px 9px rgba(255,220,220,.09),inset 0 -9px 17px rgba(42,12,12,.20),0 10px 24px rgba(78,24,28,.16);transition:transform 1.35s cubic-bezier(.16,.84,.2,1),filter 1.2s ease,background 1.5s ease,box-shadow 1.5s ease}.button:after{content:"";position:absolute;inset:22%;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 50% 38%,rgba(255,225,225,.13),transparent 48%);filter:blur(8px)}.button.pressing{transform:scale(.90);filter:brightness(.96) saturate(1.06);box-shadow:inset 0 8px 16px rgba(55,14,14,.22),inset 0 -5px 12px rgba(255,210,210,.06),0 5px 18px rgba(78,24,28,.12)}.button.active{background:radial-gradient(circle at 50% 41%,rgba(255,225,225,.24),transparent 24%),radial-gradient(circle at 50% 50%,#cb7f88 0%,#b66570 58%,#934a54 100%)}.world.shift{--tone:-10deg}.world.strong{background:radial-gradient(circle at 50% 48%,rgba(255,235,228,.48),transparent 24%),radial-gradient(circle at 50% 58%,rgba(235,132,154,.44),transparent 48%),radial-gradient(circle at 50% 88%,rgba(121,62,56,.30),transparent 52%),linear-gradient(180deg,#f3c3cd 0%,#d58b9e 58%,#92505c 100%)}.world.pulse{animation:pulse 2.8s ease}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes pulse{0%,100%{filter:hue-rotate(var(--tone)) brightness(1)}50%{filter:hue-rotate(var(--tone)) brightness(1.12) saturate(1.10)}}
</style>
</head>
<body>
<div class="world" id="world"><button class="button" id="button" aria-label="touch"></button></div>
<script>
function setVH(){document.documentElement.style.setProperty('--vh',`${window.innerHeight*0.01}px`)}setVH();window.addEventListener('resize',setVH);window.addEventListener('orientationchange',()=>setTimeout(setVH,300));const world=document.getElementById('world');const button=document.getElementById('button');let locked=false;let audioCtx=null;let lastFire=0;function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}world.style.transform='translateX(.6px)';setTimeout(()=>{world.style.transform='translateX(-.4px)'},35);setTimeout(()=>{world.style.transform=''},70)}function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function deepClick(){const ac=ctx(),now=ac.currentTime,osc=ac.createOscillator(),gain=ac.createGain(),filter=ac.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(52,now);osc.frequency.exponentialRampToValueAtTime(30,now+.52);filter.type='lowpass';filter.frequency.setValueAtTime(120,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.26,now+.055);gain.gain.exponentialRampToValueAtTime(.0001,now+.82);osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);osc.start(now);osc.stop(now+.86)}function lowHum(duration=3){const ac=ctx(),now=ac.currentTime,osc=ac.createOscillator(),gain=ac.createGain();osc.type='triangle';osc.frequency.setValueAtTime(38,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.25);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(ac.destination);osc.start(now);osc.stop(now+duration)}function cls(el,name,ms){el.classList.add(name);setTimeout(()=>el.classList.remove(name),ms)}const effects=[()=>{},()=>cls(world,'shift',2400),()=>cls(world,'strong',2800),()=>cls(button,'active',2400),()=>cls(world,'pulse',2800),()=>lowHum(3),()=>vibrate(70),()=>vibrate([90,120,140]),()=>setTimeout(()=>lowHum(4.5),1200),()=>setTimeout(()=>vibrate([60,120,80]),1000)];function activate(e){if(e){e.preventDefault();e.stopPropagation()}const now=Date.now();if(locked||now-lastFire<800)return;lastFire=now;locked=true;button.classList.add('pressing');cls(button,'active',1900);deepClick();vibrate(35);const effect=effects[Math.floor(Math.random()*effects.length)];setTimeout(effect,500+Math.random()*1000);setTimeout(()=>button.classList.remove('pressing'),1700);setTimeout(()=>locked=false,5200)}button.addEventListener('pointerdown',activate,{passive:false});button.addEventListener('touchstart',activate,{passive:false});button.addEventListener('mousedown',activate,{passive:false});
</script>
</body>
</html>
