<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>touch</title>

<style>
:root{
  --vh: 1vh;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-width:100%;
  height:calc(var(--vh) * 100);
  min-height:calc(var(--vh) * 100);
  overflow:hidden;
  background:#2b1916;
  position:fixed;
  inset:0;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

body{
  touch-action:manipulation;
  overscroll-behavior:none;
}

.bg{
  position:fixed;
  left:0;
  top:0;
  width:100vw;
  height:calc(var(--vh) * 100);
  min-height:calc(var(--vh) * 100);
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,219,204,.18), transparent 20%),
    radial-gradient(circle at 50% 60%, rgba(138,72,58,.34), transparent 42%),
    linear-gradient(180deg,#5a382f 0%,#37221e 48%,#211411 100%);
}

.bg::after{
  content:"";
  position:absolute;
  inset:-18%;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,232,222,.13), transparent 31%),
    radial-gradient(circle at 68% 18%, rgba(0,0,0,.18), transparent 38%);
  filter:blur(64px);
  animation:breathe 10s ease-in-out infinite;
}

.screen{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(74vw,420px);
  aspect-ratio:.72/1;
  border-radius:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 39%, rgba(255,235,226,.55), transparent 19%),
    radial-gradient(circle at 50% 50%, rgba(190,112,94,.22), transparent 44%),
    linear-gradient(180deg,#edc9bd 0%,#c89081 58%,#8a574d 100%);
  box-shadow:
    inset 0 22px 44px rgba(255,255,255,.12),
    inset 0 -40px 80px rgba(52,20,18,.34),
    0 0 90px rgba(255,210,190,.10);
  transition:filter 2s ease, background 2s ease, transform 1.6s cubic-bezier(.16,.84,.2,1);
}

.screen::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.025) 0 1px, transparent 1px 7px);
  mix-blend-mode:soft-light;
  opacity:.4;
  pointer-events:none;
}

.button{
  position:relative;
  width:min(30vw,145px);
  aspect-ratio:1/1;
  border:none;
  outline:none;
  border-radius:999px;
  background:
    radial-gradient(circle at 50% 39%, rgba(255,220,214,.27), transparent 18%),
    radial-gradient(circle at 50% 50%, #9a564b 0%,#743b34 63%,#532822 100%);
  box-shadow:
    inset 0 10px 18px rgba(255,220,210,.10),
    inset 0 -18px 30px rgba(25,8,8,.30),
    0 12px 34px rgba(44,12,10,.26);
  transition:transform 1.45s cubic-bezier(.16,.84,.2,1), filter 1.5s ease;
}

.button::after{
  content:"";
  position:absolute;
  inset:18%;
  border-radius:inherit;
  background:radial-gradient(circle at 50% 38%, rgba(255,220,215,.22), transparent 40%);
  filter:blur(8px);
  pointer-events:none;
}

.button.pressing{ transform:scale(.84); }
.screen.shift{ filter:hue-rotate(-7deg) saturate(1.08); }
.screen.pulse{ animation:pulse 3s ease; }
.button.warm{ filter:brightness(1.08) saturate(1.08); }

@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}

@keyframes pulse{
  0%{box-shadow:inset 0 22px 44px rgba(255,255,255,.12),inset 0 -40px 80px rgba(52,20,18,.34),0 0 90px rgba(255,210,190,.10)}
  50%{box-shadow:inset 0 22px 44px rgba(255,255,255,.16),inset 0 -40px 80px rgba(52,20,18,.34),0 0 160px rgba(255,220,205,.24)}
  100%{box-shadow:inset 0 22px 44px rgba(255,255,255,.12),inset 0 -40px 80px rgba(52,20,18,.34),0 0 90px rgba(255,210,190,.10)}
}
</style>
</head>

<body>
<div class="bg"></div>
<div class="screen" id="screen">
  <button class="button" id="button"></button>
</div>

<script>
function setVH(){
  document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
}
setVH();
window.addEventListener("resize", setVH);
window.addEventListener("orientationchange", () => setTimeout(setVH, 300));

document.addEventListener("touchmove", e => e.preventDefault(), {passive:false});

const button = document.getElementById("button");
const screen = document.getElementById("screen");
let locked = false;
let audioCtx;

function vibrate(pattern){
  if("vibrate" in navigator) navigator.vibrate(pattern);
}

function ctx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function deepClick(){
  const ac = ctx();
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  const filter = ac.createBiquadFilter();
  osc.type = "sine";
  osc.frequency.setValueAtTime(58, now);
  osc.frequency.exponentialRampToValueAtTime(36, now + 0.45);
  filter.type = "lowpass";
  filter.frequency.value = 160;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.22, now + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.7);
}

function lowHum(duration=2.6){
  const ac = ctx();
  const now = ac.currentTime;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = "triangle";
  osc.frequency.value = 42;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.03, now + 0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function shiftTone(){
  screen.classList.add("shift");
  setTimeout(()=>screen.classList.remove("shift"),2500);
}

function pulse(){
  screen.classList.remove("pulse");
  void screen.offsetWidth;
  screen.classList.add("pulse");
}

function warm(){
  button.classList.add("warm");
  setTimeout(()=>button.classList.remove("warm"),2200);
}

const effects = [
  ()=>{},
  ()=>shiftTone(),
  ()=>warm(),
  ()=>pulse(),
  ()=>lowHum(),
  ()=>vibrate(40),
  ()=>vibrate([70,100,120]),
  ()=>setTimeout(()=>lowHum(4),1500),
  ()=>setTimeout(()=>vibrate([40,120,60]),1200)
];

button.addEventListener("click", ()=>{
  if(locked) return;
  locked = true;
  button.classList.add("pressing");
  deepClick();
  const effect = effects[Math.floor(Math.random()*effects.length)];
  setTimeout(effect, 600 + Math.random()*1400);
  setTimeout(()=>button.classList.remove("pressing"),1800);
  setTimeout(()=>locked=false,4800);
});
</script>
</body>
</html>
